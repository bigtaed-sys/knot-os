<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="KnotOS — open-source router firmware for Raspberry Pi" />
		<title>KnotOS</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="antialiased">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Apply saved theme synchronously before paint to avoid a flash.
			(function() {
				try {
					var saved = localStorage.getItem('knot.theme');
					var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
					if (theme === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
	</body>
</html>
