name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (UI + Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            core/go.sum
            cli/go.sum

      - name: Build UI and stage for embed
        run: bash scripts/build-ui.sh

      - name: Vet
        run: |
          go vet ./core/...
          go vet ./cli/...

      - name: Build native (linux/amd64)
        run: |
          go build ./core/cmd/knotd
          go build ./cli/cmd/knotctl

      - name: Cross-build (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build ./core/cmd/knotd
          GOOS=linux GOARCH=arm64 go build ./cli/cmd/knotctl

      - name: Test
        run: |
          go test ./core/... ./cli/...

      - name: UI typecheck
        working-directory: ui
        run: npm run check
