name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            core/go.sum
            cli/go.sum

      - name: Vet
        run: |
          go vet ./core/...
          go vet ./cli/...

      - name: Build native
        run: |
          go build ./core/cmd/knotd
          go build ./cli/cmd/knotctl

      - name: Cross-build (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build ./core/cmd/knotd
          GOOS=linux GOARCH=arm64 go build ./cli/cmd/knotctl

      - name: Test
        run: |
          go test ./core/... ./cli/...

  ui:
    name: UI (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
