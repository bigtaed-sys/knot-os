name: release

# Triggered when a tag matching v*.*.* is pushed. Builds UI + knotd
# for linux/arm64, signs the binary with the Ed25519 release key
# from the repo secret, attaches both `knotd-linux-arm64` and
# `knotd-linux-arm64.sig` to the GitHub Release. Devices running an
# embedded public-half-of-the-same-key verify against this artifact
# at /api/system/update/check time.
#
# Required secrets (Settings → Secrets → Actions):
#
#   RELEASE_PRIVATE_KEY  hex-encoded 64-byte Ed25519 private key
#   RELEASE_PUBLIC_KEY   hex-encoded 32-byte Ed25519 public key
#                         (also baked into the binary via -ldflags so
#                         the running daemon can verify future
#                         updates against the same key it shipped
#                         under)
#
# Generate a fresh keypair locally with `cmd/knot-keygen` (added in
# this same milestone) and store the two halves as the secrets above.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-sign:
    name: Build + sign knotd
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for softprops/action-gh-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: bash scripts/build-ui.sh

      - name: Cross-compile knotd (linux/arm64) with embedded release key
        env:
          GOOS: linux
          GOARCH: arm64
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_PUBLIC_KEY}" ]]; then
            echo "::error::RELEASE_PUBLIC_KEY secret is empty — refusing to build an unsigned-friendly release binary"
            exit 1
          fi
          mkdir -p dist/arm64
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION#v} -X github.com/knot-os/knot-os/core/internal/update.releaseKeyHex=${RELEASE_PUBLIC_KEY}" \
            -o dist/arm64/knotd \
            ./core/cmd/knotd
          # Sanity: confirm the embedded key actually got linked in.
          if ! strings dist/arm64/knotd | grep -q "${RELEASE_PUBLIC_KEY}"; then
            echo "::error::release key not present in built binary — ldflags injection broken"
            exit 1
          fi
          ls -la dist/arm64/

      - name: Cross-compile knotctl (linux/arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION#v}" \
            -o dist/arm64/knotctl \
            ./cli/cmd/knotctl

      - name: Build, package + sign the example-hello plugin
        env:
          GOOS: linux
          GOARCH: arm64
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          pdir=plugins/example-hello
          # GOWORK=off only for the plugin (a standalone module outside
          # the workspace); knot-sign below builds with the workspace.
          ( cd "$pdir" && GOWORK=off go build -trimpath -ldflags '-s -w' -o example-hello . )
          # Package the manifest + binary at the zip root (matches the
          # plugin store contract). Built in a clean staging dir so no
          # stray files (go.mod, *.go) get bundled.
          stage="$(mktemp -d)"
          cp "$pdir/plugin.yaml" "$pdir/example-hello" "$stage/"
          ( cd "$stage" && zip -q -X example-hello-linux-arm64.zip plugin.yaml example-hello )
          mv "$stage/example-hello-linux-arm64.zip" dist/arm64/
          go build -o /tmp/knot-sign ./core/cmd/knot-sign
          /tmp/knot-sign \
            -key "${RELEASE_PRIVATE_KEY}" \
            -in dist/arm64/example-hello-linux-arm64.zip \
            -out dist/arm64/example-hello-linux-arm64.zip.sig

      - name: Sign knotd with release key
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_PRIVATE_KEY}" ]]; then
            echo "::error::RELEASE_PRIVATE_KEY secret is empty"
            exit 1
          fi
          # Build the tiny signer once and use it.
          go build -o /tmp/knot-sign ./core/cmd/knot-sign
          /tmp/knot-sign \
            -key "${RELEASE_PRIVATE_KEY}" \
            -in dist/arm64/knotd \
            -out dist/arm64/knotd-linux-arm64.sig
          mv dist/arm64/knotd dist/arm64/knotd-linux-arm64
          ls -la dist/arm64/

      - name: Verify signature locally before publishing
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
        run: |
          go build -o /tmp/knot-verify ./core/cmd/knot-verify
          /tmp/knot-verify \
            -key "${RELEASE_PUBLIC_KEY}" \
            -in dist/arm64/knotd-linux-arm64 \
            -sig dist/arm64/knotd-linux-arm64.sig
          echo "✓ signature verifies under release public key"

      - name: Compute SHA-256 sums
        run: |
          cd dist/arm64
          sha256sum knotd-linux-arm64 knotd-linux-arm64.sig knotctl \
            example-hello-linux-arm64.zip example-hello-linux-arm64.zip.sig > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arm64/knotd-linux-arm64
            dist/arm64/knotd-linux-arm64.sig
            dist/arm64/knotctl
            dist/arm64/example-hello-linux-arm64.zip
            dist/arm64/example-hello-linux-arm64.zip.sig
            dist/arm64/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
